name: CI/CD - Node + PostgreSQL + Redis + Nginx

on:
  push:
    branches: [main]

concurrency:
  group: project4-deploy
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build images (no cache)
        run: docker compose build --no-cache

      - name: Bring stack up for testing
        run: docker compose up -d

      - name: Wait for all services to be healthy
        run: |
          echo "Waiting for services to report healthy..."
          for i in $(seq 1 30); do
            docker compose ps
            unhealthy=$(docker compose ps | grep -E "starting|unhealthy" | wc -l)
            if [ "$unhealthy" -eq 0 ]; then
              echo "All services healthy."
              break
            fi
            echo "Still waiting ($i/30)..."
            sleep 3
          done

      - name: Test - GET /api/health
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/health)
          echo "Status: $status"
          [ "$status" = "200" ]

      - name: Test - GET /api/items
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/items)
          echo "Status: $status"
          [ "$status" = "200" ]

      - name: Test - GET / (home page)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/)
          echo "Status: $status"
          [ "$status" = "200" ]

      - name: Print logs on failure
        if: failure()
        run: docker compose logs

      - name: Deploy - keep stack running on the server
        if: success()
        run: docker compose up -d

      - name: Cleanup on failure only
        if: failure()
        run: docker compose down -v