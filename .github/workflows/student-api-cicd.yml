name: Student API CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PORT: 8000

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest -v

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Create or restart service
        run: bash scripts/deploy_service_linux.sh

      - name: Health check
        run: |
          sleep 3
          curl -sf "http://127.0.0.1:$PORT/students"
